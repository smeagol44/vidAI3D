name: Publish VIDA 3D current Wiki pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - '.github/workflows/publish-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vida3d-wiki-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Publish maintained current feature pages to the actual Wiki
        shell: bash
        env:
          WIKI_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --quiet "https://x-access-token:${WIKI_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "${RUNNER_TEMP}/vida3d-wiki"
          cp -- docs/wiki/Home.md docs/wiki/_Sidebar.md docs/wiki/Interface-and-Controls.md docs/wiki/Audio-and-Music.md "${RUNNER_TEMP}/vida3d-wiki/"
          cd "${RUNNER_TEMP}/vida3d-wiki"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Home.md _Sidebar.md Interface-and-Controls.md Audio-and-Music.md
          if git diff --cached --quiet; then
            echo "The actual Wiki is already current."
            exit 0
          fi
          git commit -m "Maintain current VIDA 3D interface and audio reference"
          git push origin HEAD
          git ls-remote --exit-code origin HEAD
